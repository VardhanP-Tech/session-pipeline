<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Arial,sans-serif" font-size="13">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
<style>.b{fill:#eef4ff;stroke:#3b6fd4;stroke-width:1.5}.r{fill:#fff1f0;stroke:#d4493b;stroke-width:1.5}.g{fill:#effaf0;stroke:#2f9e44;stroke-width:1.5}.l{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}text{fill:#222}</style>
<rect class="b" x="10" y="30" width="120" height="50" rx="6"/><text x="70" y="52" text-anchor="middle">events.csv</text><text x="70" y="68" text-anchor="middle">(source)</text>
<rect class="b" x="10" y="130" width="120" height="50" rx="6"/><text x="70" y="152" text-anchor="middle">users.csv</text><text x="70" y="168" text-anchor="middle">(reference)</text>
<rect class="b" x="170" y="30" width="130" height="50" rx="6"/><text x="235" y="52" text-anchor="middle">Schema check</text><text x="235" y="68" text-anchor="middle">(file level)</text>
<rect class="b" x="340" y="30" width="130" height="50" rx="6"/><text x="405" y="52" text-anchor="middle">Row validation</text><text x="405" y="68" text-anchor="middle">+ normalise UTC</text>
<rect class="b" x="510" y="30" width="130" height="50" rx="6"/><text x="575" y="52" text-anchor="middle">Dedupe vs store</text><text x="575" y="68" text-anchor="middle">(event_id)</text>
<rect class="g" x="700" y="10" width="190" height="45" rx="6"/><text x="795" y="37" text-anchor="middle">events_clean</text>
<rect class="r" x="700" y="75" width="190" height="45" rx="6"/><text x="795" y="102" text-anchor="middle">rejects (file, line, reason)</text>
<rect class="b" x="510" y="170" width="190" height="50" rx="6"/><text x="605" y="192" text-anchor="middle">Rebuild sessions for</text><text x="605" y="208" text-anchor="middle">affected users (gap &gt; 1800s)</text>
<rect class="g" x="740" y="170" width="150" height="50" rx="6"/><text x="815" y="200" text-anchor="middle">sessions</text>
<rect class="b" x="170" y="270" width="210" height="50" rx="6"/><text x="275" y="292" text-anchor="middle">pipeline_runs + run JSON</text><text x="275" y="308" text-anchor="middle">(status, counts, error)</text>
<rect class="b" x="510" y="270" width="380" height="50" rx="6"/><text x="700" y="292" text-anchor="middle">Export CSV + SQL reconciliation + ground-truth check</text><text x="700" y="308" text-anchor="middle">(reconciliation_report.md / .json)</text>
<path class="l" d="M130 55 H170"/><path class="l" d="M300 55 H340"/><path class="l" d="M470 55 H510"/>
<path class="l" d="M640 45 H700"/><path class="l" d="M640 65 L700 95"/>
<path class="l" d="M130 155 H405 V80"/>
<path class="l" d="M575 80 V170"/><path class="l" d="M700 195 H740"/>
